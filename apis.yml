name: Massive Dynamic
description: Massive Dynamic is an AI-powered advertising platform that bills itself as "The Advertising
  Copilot" and "the human-AI interface for massive scale." It helps media and advertising teams coordinate
  large-scale digital ad campaigns by pairing an AI Analysis Copilot (automating daily analytics checks,
  quarterly business reviews, and Media Mix Modeling) with Execution Delegation, where an AI agent handles
  operational campaign setup so strategists can focus on decisions. The tool works inside existing Slack
  and email workflows as a conduit between strategy and activation teams, and emphasizes enterprise-grade
  data governance with ring-fenced customer data and an explicit commitment not to use customer data to
  train or improve models. Founded in Paris in 2025 by Trystan Chabert (formerly Head of Growth at Voodoo)
  and Guillaume le Roy (formerly Head of Engineering at Qonto), the company raised a roughly EUR 3M pre-seed
  led by Seedcamp in July 2025, with Founders Future, Kima Ventures and others participating, and is
  deployed with a select group of early design partners. It sells its product as an end-user application —
  the marketing site is a Figma Sites page whose only call to action is "Request a demo", and the product
  itself is a login-gated web app at app.massive-dynamic.ai. As of the 2026-08-12 enrichment pass Massive
  Dynamic publishes no public API, no developer documentation, no SDKs, and no machine-readable contract of
  any kind — every OpenAPI, GraphQL, MCP, agent-card and /.well-known/ probe against its marketing, API and
  app hosts returned 404 or an application shell.
